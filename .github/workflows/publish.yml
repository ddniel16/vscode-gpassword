name: Publish

permissions:
  contents: write

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  package:
    if: github.event.base_ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    name: Package Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Install dependencies
        run: pnpm ci

      - name: Package the extension
        run: pnpx @vscode/vsce package --no-dependencies

      - name: Find VSIX file
        id: find_vsix
        run: |
          set -euo pipefail
          FILE=$(ls *.vsix | head -n 1 || true)
          if [ -z "$FILE" ]; then
            echo "VSIX file not found" >&2
            exit 1
          fi
          echo "vsix_file=$FILE" >> $GITHUB_OUTPUT
          echo "Found: $FILE"

      - name: Subir VSIX como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ github.ref_name }}
          path: ${{ steps.find_vsix.outputs.vsix_file }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Extension
    needs: package
    runs-on: ubuntu-latest
    environment: Publish Extension
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Descargar artefacto VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-${{ github.ref_name }}

      - name: Find VSIX file
        id: find_vsix
        run: |
          set -euo pipefail
          FILE=$(ls *.vsix | head -n 1 || true)
          if [ -z "$FILE" ]; then
            echo "VSIX file not found" >&2
            exit 1
          fi
          echo "VSIX_FILE=$FILE" >> $GITHUB_ENV
          echo "Found: $FILE"

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT}" ]; then
            echo "VSCE_PAT (VS_MARKETPLACE_TOKEN) no configurado. Saltando publicación Marketplace." >&2
            exit 0
          fi
          echo "Publicando en VS Code Marketplace..."
          pnpx @vscode/vsce publish --pat "$VSCE_PAT" --packagePath "$VSIX_FILE"

      - name: Publish to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_TOKEN}" ]; then
            echo "OVSX_TOKEN no configurado. Saltando publicación Open VSX." >&2
            exit 0
          fi
          echo "Publicando en Open VSX..."
          pnpx ovsx@latest publish "$VSIX_FILE" --pat "$OVSX_TOKEN"
